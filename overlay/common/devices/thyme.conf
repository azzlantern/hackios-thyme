# Device profile: sourced by common/build.sh and common/run.sh.
NAME="Xiaomi 10S (thyme)"
KIND=phone
SOC="Qualcomm Snapdragon 870 (SM8250-AC)"

# --- boot chain (phones) ---------------------------------------------------------------------------
# The phone boots a Mu-Silicium UEFI (Project Silicium) with `fastboot boot`; the UEFI starts our loader.
UEFI_TARGET=alioth
BOOTSHIM=${BOOTSHIM:-prebuilt/uefi_sm8250/BootShim.bin}
UEFI_FD=${UEFI_FD:-prebuilt/uefi_sm8250/SILICIUM_UEFI.fd}
DTB=${THYME_DTB:-${DTB:-prebuilt/thyme.dtb}}
FD_BASE=0x9FC00000
FD_SIZE=0x300000
PAYLOAD_BASE=0xF0000000

# --- kernel and loader -----------------------------------------------------------------------------
FB_BASE=0x9C000000
WIFI_ATH11K=0

# --- what the run needs ----------------------------------------------------------------------------
BOOTARGS="touchscreen=1 thyme=1 touch_verbose=1 cpufreq=1 bootcpu=7 cpus=8 battery=1"
DEFAULT_SECS=900
USERLAND_VARS=""
FIRMWARE=""
